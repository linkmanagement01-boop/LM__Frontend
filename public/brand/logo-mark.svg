<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Link Management mark: two interlocking links (violet → fuchsia) -->
  <defs>
    <linearGradient id="lmA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="lmB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/><stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <clipPath id="lmTop"><rect x="-20" y="-20" width="104" height="52"/></clipPath>
    <clipPath id="lmBottom"><rect x="-20" y="32" width="104" height="52"/></clipPath>
    <!-- gaps where one link passes over the other -->
    <mask id="lmMaskA" maskUnits="userSpaceOnUse" x="-20" y="-20" width="104" height="104">
      <rect x="-20" y="-20" width="104" height="104" fill="#fff"/>
      <rect x="27" y="22" width="30" height="20" rx="10" fill="none" stroke="#000" stroke-width="12" clip-path="url(#lmTop)"/>
    </mask>
    <mask id="lmMaskB" maskUnits="userSpaceOnUse" x="-20" y="-20" width="104" height="104">
      <rect x="-20" y="-20" width="104" height="104" fill="#fff"/>
      <rect x="7" y="22" width="30" height="20" rx="10" fill="none" stroke="#000" stroke-width="12" clip-path="url(#lmBottom)"/>
    </mask>
  </defs>
  <g transform="rotate(-45 32 32)">
    <rect x="7" y="22" width="30" height="20" rx="10" fill="none" stroke="url(#lmA)" stroke-width="6.5" mask="url(#lmMaskA)"/>
    <rect x="27" y="22" width="30" height="20" rx="10" fill="none" stroke="url(#lmB)" stroke-width="6.5" mask="url(#lmMaskB)"/>
  </g>
</svg>
